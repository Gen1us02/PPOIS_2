{% extends 'layouts/base.html' %}
{% load static %}

{% block title %}Выучить фразу - Система робота{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card shadow">
                <div class="card-header bg-warning text-dark text-center">
                    <h3 class="h5 mb-0"><i class="bi bi-journal-bookmark-fill"></i> Выучить новую фразу</h3>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_name" class="form-label">Фраза</label>
                            <input type="text" name="name" id="id_name" class="form-control" placeholder="Введите фразу для обучения" required>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'robot:index' %}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Назад
                            </a>
                            <button type="submit" class="btn btn-warning">
                                <i class="bi bi-book"></i> Сохранить фразу
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
